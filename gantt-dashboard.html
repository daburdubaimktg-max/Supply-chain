<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Transition Gantt Dashboard</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
/* Layout: one project, three views (Dashboard, Gantt, Settings). Status date drives every status.
   Workstream colours follow the workbook's "Project Structure" palette. */
:root{
  --bg:#EEF1F4; --surface:#FFFFFF; --surface2:#F5F7F9; --ink:#17202A; --muted:#5B6873; --line:#D6DDE3; --grid:#E6EBEF; --weekend:#F3F5F7;
  --accent:#1F5F8B; --accent-ink:#FFFFFF; --mile:#17202A; --status:#C2410C;
  --good:#2E7D4F; --warn:#B7791F; --crit:#C2372B; --shadow:0 2px 6px rgba(20,35,50,.07),0 12px 28px rgba(20,35,50,.08);
  --f-display:"Barlow Semi Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E141A; --surface:#151E26; --surface2:#1A242D; --ink:#E3E9EE; --muted:#93A1AC; --line:#2A3641; --grid:#202B35; --weekend:#18222B;
  --accent:#5AA7DA; --accent-ink:#06202F; --mile:#E3E9EE; --status:#F28C4B;
  --good:#5DC08B; --warn:#E2AA4C; --crit:#EF6B5F; --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.3); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E141A; --surface:#151E26; --surface2:#1A242D; --ink:#E3E9EE; --muted:#93A1AC; --line:#2A3641; --grid:#202B35; --weekend:#18222B;
  --accent:#5AA7DA; --accent-ink:#06202F; --mile:#E3E9EE; --status:#F28C4B;
  --good:#5DC08B; --warn:#E2AA4C; --crit:#EF6B5F; --shadow:0 2px 6px rgba(0,0,0,.3),0 12px 28px rgba(0,0,0,.3); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:14px/1.45 var(--f-body)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1640px;margin:0 auto}
header.top{background:var(--surface);border-bottom:1px solid var(--line)}
.top-row{display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px;padding-block:12px}
.brand{display:flex;align-items:center;gap:10px;font:700 19px/1 var(--f-display);letter-spacing:.03em;text-transform:uppercase;margin-right:auto}
.actions{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
nav.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none}
nav.tabs a{padding:10px 14px;text-decoration:none;color:var(--muted);font:600 15px/1 var(--f-display);letter-spacing:.05em;text-transform:uppercase;border-bottom:3px solid transparent;white-space:nowrap}
nav.tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
main{padding-block:20px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance}
h1{font-size:30px;font-weight:700;letter-spacing:.01em}
h2{font-size:18px;font-weight:600;text-transform:uppercase;letter-spacing:.06em}
h3{font-size:16px;font-weight:600}
.eyebrow{font:500 11px/1.3 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--crit)}
.btn.sm{padding:4px 9px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
input[type=text],input[type=date],input[type=number],input[type=password],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:7px 9px;min-width:0}
input:disabled,select:disabled,textarea:disabled{background:var(--surface2);color:var(--ink);opacity:1;cursor:default}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:18px;min-width:0}
.phead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between;margin-bottom:14px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,460px),1fr));gap:18px}
.role-pill{display:inline-flex;align-items:center;gap:6px;font:500 12px var(--f-mono);padding:3px 9px;border-radius:999px;border:1px solid var(--line);color:var(--muted)}
.role-pill.admin{border-color:var(--status);color:var(--status)}
/* hero */
.hero{display:grid;gap:14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:20px 22px}
.hero-top{display:flex;flex-wrap:wrap;gap:10px 24px;align-items:flex-end;justify-content:space-between}
.meta{display:flex;flex-wrap:wrap;gap:8px 26px}
.meta div{display:grid;gap:2px}
.meta b{font:500 14px var(--f-mono)}
.prio{display:inline-flex;padding:2px 9px;border-radius:999px;font:600 12px var(--f-mono);background:color-mix(in srgb,var(--crit) 14%,transparent);color:var(--crit)}
.prio.Medium{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.prio.Low{background:color-mix(in srgb,var(--good) 14%,transparent);color:var(--good)}
.span-bar{position:relative;height:30px;margin-top:4px}
.span-bar .track{position:absolute;left:0;right:0;top:12px;height:6px;border-radius:3px;background:var(--grid)}
.span-bar .done{position:absolute;left:0;top:12px;height:6px;border-radius:3px;background:var(--accent)}
.span-bar .sd{position:absolute;top:0;bottom:0;border-left:2px solid var(--status)}
.span-bar .sd b{position:absolute;left:5px;top:-2px;font:500 10.5px var(--f-mono);color:var(--status);white-space:nowrap}
.span-bar .ms{position:absolute;top:9px;width:11px;height:11px;margin-left:-5px;transform:rotate(45deg);background:var(--mile);border:2px solid var(--surface)}
/* KPIs */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(175px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:grid;gap:4px;align-content:start}
.kpi .v{font:600 30px/1.05 var(--f-display);font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--muted)}
.pos{color:var(--good)} .neg{color:var(--crit)} .wrn{color:var(--warn)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;font:500 11.5px/1.5 var(--f-mono);white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.c-done{color:var(--good);background:color-mix(in srgb,var(--good) 13%,transparent)}
.c-prog{color:var(--accent);background:color-mix(in srgb,var(--accent) 13%,transparent)}
.c-behind{color:var(--warn);background:color-mix(in srgb,var(--warn) 15%,transparent)}
.c-over{color:var(--crit);background:color-mix(in srgb,var(--crit) 13%,transparent)}
.c-ns{color:var(--muted);background:color-mix(in srgb,var(--muted) 12%,transparent)}
.sw{width:10px;height:10px;border-radius:2px;display:inline-block;flex:none}
.warn-ic{color:var(--crit);font-weight:700}
/* workstreams */
.ws{display:grid}
.ws-row{display:grid;grid-template-columns:minmax(150px,220px) minmax(240px,1fr) 150px;gap:14px;align-items:center;padding:10px 0;border-top:1px solid var(--grid);cursor:pointer}
.ws-row:first-child{border-top:0}
.ws-row:hover .ws-name{color:var(--accent)}
.ws-name{font-weight:600;display:flex;gap:8px;align-items:center}
.ws-sub{font-size:12px;color:var(--muted)}
.ws-track{position:relative;height:22px;background:var(--surface2);border-radius:4px}
.ws-track i{position:absolute;top:5px;height:12px;border-radius:3px}
.ws-track i.p{opacity:.95}
.ws-track i.b{opacity:.3}
.ws-track .sd{position:absolute;top:-3px;bottom:-3px;border-left:2px solid var(--status)}
.ws-stat{display:grid;gap:4px;justify-items:end;text-align:right}
.pbar{display:inline-block;width:70px;height:5px;background:var(--grid);border-radius:3px;overflow:hidden;vertical-align:middle}
.pbar i{display:block;height:100%;background:var(--accent)}
/* milestones */
.mtrack{position:relative;height:118px;margin:6px 6px 0}
.mtrack .line{position:absolute;left:0;right:0;top:54px;height:2px;background:var(--line)}
.mtrack .m{position:absolute;top:47px;width:16px;height:16px;margin-left:-8px;transform:rotate(45deg);border:2px solid var(--surface);cursor:pointer}
.mtrack .lbl{position:absolute;width:120px;margin-left:-60px;text-align:center;font-size:12px;line-height:1.25}
.mtrack .lbl.up{bottom:76px} .mtrack .lbl.dn{top:76px}
.mtrack .sd{position:absolute;top:30px;height:50px;border-left:2px solid var(--status)}
/* loads */
.load{display:grid;gap:9px}
.lrow{display:grid;grid-template-columns:150px minmax(0,1fr) 70px;gap:10px;align-items:center;font-size:13px}
.lrow .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:7px;align-items:center}
.stack{display:flex;height:14px;border-radius:3px;overflow:hidden;background:var(--grid)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12.5px;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.list{display:grid}
.li{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;padding:9px 0;border-top:1px solid var(--grid);cursor:pointer;align-items:center}
.li:first-child{border-top:0}
.li .t{font-weight:500}
.li .sub{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:4px 14px;font-size:12.5px;color:var(--muted)}
.li:hover .t{color:var(--accent)}
/* tables */
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:7px 10px;text-align:left;border-bottom:1px solid var(--grid);white-space:nowrap}
th{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--surface2)}
td.num,th.num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
/* Gantt */
.gtools{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:6px 11px;cursor:pointer;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.chk{display:inline-flex;align-items:center;gap:6px;font-size:13px;cursor:pointer}
.hint{font-size:13px;color:var(--muted);margin:10px 0 0}
.gscroll{overflow:auto;max-height:76vh;border:1px solid var(--line);border-radius:8px;background:var(--surface);margin-top:12px}
.ghead{position:sticky;top:0;z-index:3;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.gbody{display:flex}
.gleft{position:sticky;left:0;z-index:2;flex:none;background:var(--surface);border-right:1px solid var(--line)}
.ghead .gleft{z-index:4}
.gl-row{display:grid;align-items:center;height:28px;border-bottom:1px solid var(--grid);font-size:12.5px;cursor:pointer}
.gl-row>span{padding:0 6px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.gl-row.hd{height:58px;align-items:end;padding-bottom:6px;cursor:default;font:500 10.5px/1.2 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--muted)}
.gl-row.hd>span{white-space:normal}
.gl-row.stage{background:var(--surface2);font-weight:600}
.gl-row.stage .desc{font-family:var(--f-display);font-size:14px;letter-spacing:.02em}
.gl-row:not(.hd):hover{background:color-mix(in srgb,var(--accent) 7%,var(--surface))}
.gl-row .desc{display:flex;gap:6px;align-items:center}
.gl-row .ty{font:11px var(--f-mono);color:var(--muted)}
.gl-row .num{text-align:right;font-family:var(--f-mono)}
.gl-row .dt{font-family:var(--f-mono);font-size:12px}
.gl-row .lk{color:#7C3AED}
svg text{font-family:var(--f-mono)}
.g-wk{fill:var(--weekend)}
.g-grid{stroke:var(--grid)}
.g-wkline{stroke:var(--line)}
.g-lbl{fill:var(--muted);font-size:10px}
.g-mlbl{fill:var(--ink);font-size:11px;font-weight:500}
.g-stage{opacity:.95}
.g-base{fill:var(--muted);opacity:.45}
.g-pct{fill:var(--ink);opacity:.25}
.g-txt{fill:var(--muted);font-size:10px}
.g-arrow{fill:none;stroke:var(--muted);stroke-width:1.1;opacity:.7}
.g-ah{fill:var(--muted)}
.g-sd{stroke:var(--status);stroke-width:2}
.g-sdl{fill:var(--status);font-size:10.5px;font-weight:500}
.g-bar.issue rect.o{stroke:var(--crit);stroke-width:2}
.g-rh{fill:transparent}
body:not(.viewer) .g-bar{cursor:grab}
body:not(.viewer) .g-bar.drag{cursor:grabbing}
body:not(.viewer) .g-rh{cursor:ew-resize}
body:not(.viewer) .g-bar:hover .g-rh{fill:var(--ink);fill-opacity:.22}
body.viewer .g-rh{display:none}
/* drawer + modal */
.scrim{position:fixed;inset:0;background:rgba(8,16,24,.45);z-index:20}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(470px,100%);background:var(--surface);z-index:21;box-shadow:var(--shadow);display:grid;grid-template-rows:auto 1fr auto;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.drawer .dh{padding:16px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.drawer .db{padding:16px 18px;overflow:auto;display:grid;gap:13px;align-content:start}
.drawer .df{padding:12px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:space-between;flex-wrap:wrap}
.fld{display:grid;gap:5px}
.fld>span{font:500 11px var(--f-mono);letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.fld small{color:var(--muted);font-size:12px}
.fld2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fld3{display:grid;grid-template-columns:1.3fr .8fr .7fr;gap:12px}
.calc{background:var(--surface2);border-radius:8px;padding:10px 12px;display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.calc b{font:500 13px var(--f-mono)}
.modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(560px,calc(100% - 32px));max-height:calc(100% - 48px);overflow:auto;background:var(--surface);border-radius:12px;z-index:22;box-shadow:var(--shadow);padding:20px;display:grid;gap:14px}
.frow{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.err{color:var(--crit);font-size:13px;margin:0}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;z-index:30;max-width:calc(100% - 32px);box-shadow:var(--shadow);font-size:13.5px;display:flex;gap:12px;align-items:center}
.toast button{background:transparent;border:1px solid currentColor;color:inherit;border-radius:5px;padding:2px 9px;cursor:pointer}
body.viewer .adm{display:none!important}
body:not(.viewer) .vw{display:none!important}
.settings{display:grid;gap:18px}
.formgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;max-width:980px}
@media (max-width:700px){
  h1{font-size:24px}
  .ws-row{grid-template-columns:1fr;gap:6px}
  .ws-stat{justify-items:start;text-align:left;grid-auto-flow:column;justify-content:start;gap:10px}
  .lrow{grid-template-columns:100px minmax(0,1fr) 58px}
  .fld2,.fld3{grid-template-columns:1fr}
  .mtrack .lbl{width:84px;margin-left:-42px;font-size:11px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body class="viewer">
<header class="top">

    <div class="actions">

<div id="layer"></div>

/* ===== engine: same rules as the workbook (WORKDAY / NETWORKDAYS, Mon–Fri) ===== */
/* ---- Excel-compatible engine (WORKDAY / NETWORKDAYS, Mon-Fri) ---- */
const DAY = 86400000;
const pd = s => { const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s||""); return m ? Date.UTC(+m[1], +m[2]-1, +m[3]) : NaN; };
const iso = t => new Date(t).toISOString().slice(0,10);
const isWk = t => { const d = new Date(t).getUTCDay(); return d!==0 && d!==6; };
function WORKDAY(t, n){ n = Math.trunc(n||0); if(!n) return t; const st = n>0 ? DAY : -DAY; let k = Math.abs(n); while(k){ t += st; if(isWk(t)) k--; } return t; }
function NETWORKDAYS(a, b){ if(!isFinite(a)||!isFinite(b)) return 0; const sg = b>=a ? 1 : -1; let [x,y] = sg>0 ? [a,b] : [b,a], c = 0;
  const full = Math.floor((y-x)/DAY/7); c += full*5; x += full*7*DAY; for(let t = x; t <= y; t += DAY) if(isWk(t)) c++; return c*sg; }

/* Mirrors the sheet: ind.start > ind.end > dependency (FS/SS/FF/SF + lag) ; stages summarise the rows beneath them */
function compute(D){
  const P = D.project, rows = D.rows, by = new Map(rows.map(r => [r.u, r])), out = new Map();
  const refDate = r => r.ref ? pd(P[r.ref]) : pd(r.indStart);
  // stage membership
  let stage = null, sIdx = 0; const kids = new Map();
  rows.forEach((r,i) => { r._pos = i+1; if(r.type==="Stage"){ stage = r; sIdx++; kids.set(r.u, []); r._stage = sIdx; } else { r._stage = stage ? sIdx : 0; r._parent = stage ? stage.u : null; if(stage) kids.get(stage.u).push(r); } });
  const busy = new Set();
  function calc(r){
    if(out.has(r.u)) return out.get(r.u);
    if(busy.has(r.u)){ const z = {s:NaN, e:NaN, wd:0, cyc:true}; out.set(r.u, z); return z; }
    busy.add(r.u); let res;
    if(r.type==="Stage"){
      const ks = kids.get(r.u).map(calc).filter(k => isFinite(k.s));
      const s = ks.length ? Math.min(...ks.map(k=>k.s)) : NaN, e = ks.length ? Math.max(...ks.map(k=>k.e)) : NaN;
      res = {s, e, wd: NETWORKDAYS(s, e)};
    } else {
      const wd = Math.max(+r.wd||0, 1), is = refDate(r), ie = pd(r.indEnd); let s, e, how;
      if(isFinite(is)){ s = is; e = WORKDAY(s, wd-1); how = "fixed"; }
      else if(isFinite(ie)){ e = ie; s = WORKDAY(e, -wd+1); how = "fixedEnd"; }
      else if(r.dep && by.has(r.dep)){ const p = calc(by.get(r.dep)), lag = +r.lag||0, c = r.conn||"FS"; how = "dep";
        if(c==="SS"){ s = WORKDAY(p.s, lag); e = WORKDAY(s, wd-1); }
        else if(c==="FF"){ e = WORKDAY(p.e, lag); s = WORKDAY(e, -wd+1); }
        else if(c==="SF"){ e = WORKDAY(p.s, -1+lag); s = WORKDAY(e, -wd+1); }
        else { s = WORKDAY(p.e, 1+lag); e = WORKDAY(s, wd-1); }
        if(p.cyc) how = "cycle"; }
      else { s = pd(P.start); e = WORKDAY(s, wd-1); how = "unlinked"; }
      res = {s, e, wd, how};
    }
    busy.delete(r.u); out.set(r.u, res); return res;
  }
  rows.forEach(calc);
  let ps = Infinity, pe = -Infinity; out.forEach(v => { if(isFinite(v.s) && v.s<ps) ps = v.s; if(isFinite(v.e) && v.e>pe) pe = v.e; });
  return {map: out, start: ps, end: pe, duration: NETWORKDAYS(ps, pe)};
}

// small, non-cryptographic hash for the admin PIN (soft lock)
function hashPin(str){ let h1 = 0xdeadbeef ^ 7, h2 = 0x41c6ce57 ^ 7; for(let i=0;i<str.length;i++){ const c = str.charCodeAt(i); h1 = Math.imul(h1 ^ c, 2654435761); h2 = Math.imul(h2 ^ c, 1597334677); }
  h1 = Math.imul(h1 ^ (h1>>>16), 2246822507) ^ Math.imul(h2 ^ (h2>>>13), 3266489909); h2 = Math.imul(h2 ^ (h2>>>16), 2246822507) ^ Math.imul(h1 ^ (h1>>>13), 3266489909);
  return (4294967296*(2097151 & h2) + (h1>>>0)).toString(16); }

function statusDate(){ const t = pd(D.project.statusDate); return isFinite(t) ? t : todayT(); }
function st(r){
  const c = C.map.get(r.u), sd = statusDate(), pct = r.type==="Stage" ? stagePct(r) : (+r.pct||0);
  if(pct >= 100) return {k:"done", l:"Complete"};
  if(c.e < sd) return {k:"over", l:"Overdue"};
  if(c.s <= sd){ const exp = clamp(NETWORKDAYS(c.s, sd)/Math.max(1,c.wd)*100, 0, 100); return exp - pct > 25 ? {k:"behind", l:"Behind"} : {k:"prog", l:"In progress"}; }
  return {k:"ns", l:"Not started"};
}
function childrenOf(stage){ const i = D.rows.indexOf(stage), out = []; for(let j=i+1; j<D.rows.length && D.rows[j].type!=="Stage"; j++) out.push(D.rows[j]); return out; }
function stagePct(stage){ const ks = childrenOf(stage); const w = ks.reduce((a,k)=>a+Math.max(1,C.map.get(k.u).wd),0)||1; return Math.round(ks.reduce((a,k)=>a+Math.max(1,C.map.get(k.u).wd)*(+k.pct||0),0)/w); }
function colorOf(r){

  if(mode==="Issues") return r.issue ? "#D7263D" : (r.type==="Stage" ? "#5B6770" : "#9AA5AE");

  const refMap = {"$D$14":"nppf","$D$16":"start","$D$18":"brief"}, rows = [], idMap = new Map(), depIds = [];

    const u = "r"+rows.length, idc = g(r,cB); if(idc && idc.v!=null) idMap.set(+idc.v, u);
    const dm = g(r,cM); depIds.push(dm && dm.v!=null && dm.v!=="" ? +dm.v : null);
    rows.push({u, type, desc:String(g(r,cF)?.v ?? "").trim(), member:String(g(r,cI)?.v ?? "").trim(), issue: !!(g(r,cJ) && String(g(r,cJ).v).trim()),
      indStart, ref:rf, indEnd: type==="Stage" ? null : cellDate(g(r,cL)), dep:null, conn:String(g(r,cP)?.v || "FS").trim().toUpperCase(), lag: +(g(r,cQ)?.v) || 0,
      wd: type==="Stage" ? null : (rw && typeof rw.v==="number" && !rw.f ? rw.v : (rw && typeof rw.v==="number" && type!=="Stage" ? rw.v : null)), pct: Math.round(pv),
      bs: cellDate(g(r,cU)), be: cellDate(g(r,cV)), bp: null}); }
  rows.forEach((x,i) => { if(x.type!=="Stage" && depIds[i]!=null) x.dep = idMap.get(depIds[i]) || null; });
  if(!rows.length) throw new Error("No Stage, Task or Milestone rows were found in the Gantt sheet.");
  const adminRow = (() => { for(let r=0; r<200; r++){ const c = val(S, "C"+r); if(c && String(c).trim().toLowerCase()==="admin pin hash") return String(val(S,"D"+r)||""); } return ""; })();
  return {project, departments, team, rows, adminHash: adminRow || D.adminHash};
}
function exportBook(){

  const S = []; const put = (A, r, c, v) => { while(A.length <= r) A.push([]); A[r][c] = v; };
  put(S,0,0,"Settings"); put(S,5,1,"Project Details"); put(S,5,6,"Project Role Type"); put(S,5,12,"Project Role Type");
  put(S,7,2,"Project Title"); put(S,7,3,P.title); put(S,9,2,"Project Manager"); put(S,9,3,P.manager); put(S,11,2,"Project Priority"); put(S,11,3,P.priority);
  put(S,13,2,"NPPF date"); put(S,13,3,dt(P.nppf)); put(S,15,2,"Project Start Date"); put(S,15,3,dt(P.start)); put(S,17,2,"Project Brief"); put(S,17,3,dt(P.brief));
  put(S,21,2,"Admin PIN hash"); put(S,21,3,D.adminHash);
  put(S,7,7,"Department"); put(S,7,8,"Code"); put(S,7,9,"#"); put(S,7,13,"Name"); put(S,7,14,"Role"); put(S,7,15,"Code");
  D.departments.forEach((d,i) => { put(S,8+i,7,d.name); put(S,8+i,8,d.code); put(S,8+i,9,D.team.filter(t=>t.role===d.name).length); });
  D.team.forEach((t,i) => { put(S,8+i,13,t.name); put(S,8+i,14,t.role); put(S,8+i,15,codeOf(t.role)); });
  const ws1 = XLSX.utils.aoa_to_sheet(S, {cellDates:true}); ws1["!cols"] = [{wch:3},{wch:3},{wch:20},{wch:34},{},{},{},{wch:24},{wch:8},{wch:5},{},{},{},{wch:20},{wch:24},{wch:8}];
  // Gantt: same columns (A–W), values instead of formulas
  const Gt = []; put(Gt,0,0,P.title); put(Gt,1,23,"Project Timespan:"); put(Gt,1,31,dT(C.start)); put(Gt,1,35,"-"); put(Gt,1,36,dT(C.end)); put(Gt,1,40,C.duration); put(Gt,1,45,"Project Manager:"); put(Gt,1,52,P.manager);
  put(Gt,4,29,"Color"); put(Gt,5,29,P.colorBy); put(Gt,9,10,"Action Plan"); put(Gt,9,20,"Base Plan"); put(Gt,10,10,"Updates on:"); put(Gt,10,20,"Saved on:"); put(Gt,11,10,dt(P.statusDate)); put(Gt,11,20,P.baseSavedOn?dt(P.baseSavedOn):"x-xxx-x");
  put(Gt,11,1,"ID's"); put(Gt,11,4,"Item Details");
  ["Color Code","id","s\nid","r\nid","Type","Description","x","Role","Team\nMember","⚠","Ind \nStart","Ind End","d.\nId","d. \nitem","","d.\nconn","d.\nLag","Work Days","Start Date","End Date","Start","End","%"].forEach((h,c) => put(Gt,12,c,h));
  D.rows.forEach((r,i) => { const c = C.map.get(r.u), row = 14+i, dep = r.dep ? rowById(r.dep) : null, ri = roleIdx(deptOf(r.member));
    const vals = ["", i+1, r._stage||"", r.type==="Stage" ? -1 : (ri>=0 ? ri+1 : -1), r.type, r.desc, "", codeOf(deptOf(r.member)), r.member, r.issue?"⚠":"",
      r.type==="Stage" ? dT(c.s) : (r.ref ? dt(D.project[r.ref]) : dt(r.indStart)), dt(r.indEnd), dep ? posOf(dep.u) : "", dep ? (posOf(dep.u) < i+1 ? "↖" : "↙") : "", dep ? `(${dep.type[0]})${dep.desc.length>7?dep.desc.slice(0,7)+"…":dep.desc}` : "",
      r.conn||"FS", +r.lag||"", r.type==="Stage" ? c.wd : (r.wd ?? ""), dT(c.s), dT(c.e), dt(r.bs), dt(r.be), r.type==="Stage" ? stagePct(r)/100 : (+r.pct||0)/100];
    vals.forEach((v,cI) => put(Gt,row,cI,v)); });
  const ws2 = XLSX.utils.aoa_to_sheet(Gt, {cellDates:true}); ws2["!cols"] = [{wch:6},{wch:4},{wch:4},{wch:4},{wch:10},{wch:32},{wch:2},{wch:6},{wch:18},{wch:3},{wch:10},{wch:10},{wch:5},{wch:3},{wch:12},{wch:5},{wch:5},{wch:6},{wch:11},{wch:11},{wch:11},{wch:11},{wch:6}];
  D.rows.forEach((r,i) => { const row = 15+i; if(r.ref && ws2["K"+row]) ws2["K"+row].f = "Settings!$D$" + ({nppf:14, start:16, brief:18})[r.ref]; const dp = r.dep ? posOf(r.dep) : 0; if(dp && ws2["M"+row]) ws2["M"+row].f = "B" + (14+dp); });
  [ws1, ws2].forEach(ws => Object.keys(ws).forEach(k => { const c = ws[k]; if(c && c.t==="d") c.z = "dd-mmm-yy"; }));
  XLSX.utils.book_append_sheet(wb, ws1, "Settings"); XLSX.utils.book_append_sheet(wb, ws2, "Gantt");
  const name = (P.title || "Gantt").replace(/[^\w\- ]+/g,"").trim().replace(/\s+/g,"_") + "_" + iso(todayT()) + ".xlsx";
  try { XLSX.writeFile(wb, name, {cellDates:true}); toast(`Exported ${name}.`); } catch(e){ toast("Download is blocked in this preview. Open the dashboard file on your computer to export."); }
}
function importDialog(){
  $("#layer").innerHTML = `<div class="scrim" data-close="1"></div><div class="modal" role="dialog" aria-modal="true" aria-labelledby="imT"><h3 id="imT">Import the Gantt workbook</h3>
    <p class="muted" style="margin:0">Choose the master workbook from your OneDrive folder. It must have the <b>Settings</b> and <b>Gantt</b> sheets in the same layout as <i>Gant_Chart_Updated.xlsx</i>. This replaces the plan shown here.</p>
    <label class="fld"><span>Workbook</span><input type="file" id="imFile" accept=".xlsx,.xlsm,.xls"></label><p class="err" id="imErr" hidden></p>
    <div class="frow" style="justify-content:flex-end"><button class="btn" type="button" data-close="1">Cancel</button><button class="btn primary" type="button" id="imGo">Import</button></div></div>`;
  $("#imGo").onclick = () => { const f = $("#imFile").files[0], er = $("#imErr"); if(!f){ er.textContent = "Choose a workbook first."; er.hidden = false; return; }
    if(typeof XLSX==="undefined"){ er.textContent = "The Excel library did not load. Check the internet connection and reload."; er.hidden = false; return; }
    const rd = new FileReader(); rd.onload = () => { try { const before = snapshot(); const nd = importBook(XLSX.read(new Uint8Array(rd.result), {type:"array", cellDates:true, cellFormula:true}));
        D = nd; closeLayer(); render(); toast(`Imported ${D.rows.length} rows, ${D.team.length} team members.`, () => restore(before)); } catch(e){ er.textContent = e.message || "This file could not be read."; er.hidden = false; } };
    rd.readAsArrayBuffer(f); };
}

/* ===== events ===== */
document.addEventListener("click", e => {
  const t = e.target, adm = isAdmin();
  if(t.closest("[data-close]")){ closeLayer(); return; }
  const rowEl = t.closest("[data-row]"); if(rowEl && !t.closest("#layer")){ if(Date.now() - lastDrag < 300) return; openRow(rowEl.dataset.row); return; }
  const z = t.closest("[data-zoom]"); if(z){ ui.zoom = z.dataset.zoom; render(); return; }
  const id = t.id;
  if(id==="btnAdmin"){ if(adm){ setAdmin(false); render(); toast("Signed out. The dashboard is view only."); } else signIn(); return; }
  if(id==="btnExport"){ exportBook(); return; }
  if(!adm) return;
  if(id==="btnImport") importDialog();
  else if(id==="addRow") openRow(null, D.rows[D.rows.length-1]?.u);
  else if(id==="addDept"){ D.departments.push({name:"New department", code:"NEW"}); render(); }
  else if(id==="addMember"){ D.team.push({name:"New member", role:D.departments[0]?.name||""}); render(); }
  else if(t.dataset.deldept){ const d = D.departments[+t.dataset.deldept], n = D.team.filter(x=>x.role===d.name).length; if(n){ toast(`${d.name} still has ${n} team member(s). Move them first.`); return; } D.departments.splice(+t.dataset.deldept,1); render(); }
  else if(t.dataset.delmem){ const m = D.team[+t.dataset.delmem], n = D.rows.filter(r=>r.member===m.name).length; if(n){ toast(`${m.name} is on ${n} row(s). Reassign them first.`); return; } D.team.splice(+t.dataset.delmem,1); render(); }
  else if(id==="saveBase"){ const before = snapshot(); D.rows.forEach(r => { const c = C.map.get(r.u); r.bs = iso(c.s); r.be = iso(c.e); r.bp = r.type==="Stage" ? stagePct(r) : (+r.pct||0); }); D.project.baseSavedOn = iso(todayT()); render(); toast("Base plan saved.", () => restore(before)); }
  else if(id==="clearBase"){ const before = snapshot(); D.rows.forEach(r => { r.bs = r.be = null; r.bp = null; }); D.project.baseSavedOn = null; render(); toast("Base plan cleared.", () => restore(before)); }
  else if(id==="resetData"){ const before = snapshot(), h = D.adminHash; D = fresh(); D.adminHash = h; render(); toast("Reset to the data from Gant_Chart_Updated.xlsx.", () => restore(before)); }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if(t.id==="gColor"){ ui.colorBy = t.value; render(); return; }
  if(t.id==="gPlan"){ ui.plan = t.checked; render(); return; }
  if(t.id==="gBase"){ ui.base = t.checked; render(); return; }
  if(t.id==="gDeps"){ ui.deps = t.checked; render(); return; }
  if(!isAdmin()) return;
  if(d.dept){ const [i,k] = d.dept.split(":"), dep = D.departments[+i], old = dep.name, v = t.value.trim(); if(!v) return; if(k==="name") D.team.forEach(m => { if(m.role===old) m.role = v; }); dep[k] = v; render(); }
  if(d.mem){ const [i,k] = d.mem.split(":"), m = D.team[+i], old = m.name, v = t.value.trim(); if(!v) return; if(k==="name"){ D.rows.forEach(r => { if(r.member===old) r.member = v; }); if(D.project.manager===old) D.project.manager = v; } m[k] = v; render(); }
});
document.addEventListener("submit", e => {
  if(!isAdmin()){ e.preventDefault(); return; }
  if(e.target.id==="projForm"){ e.preventDefault(); const before = snapshot(), oldEnd = C.end;
    Object.assign(D.project, {title:$("#sTitle").value.trim()||D.project.title, manager:$("#sPM").value, priority:$("#sPrio").value, statusDate:$("#sStatus").value||null, nppf:$("#sNppf").value||null, start:$("#sStart").value||null, brief:$("#sBrief").value||null, colorBy:$("#sColor").value});
    ui.colorBy = null; render(); toast("Project details saved." + endShift(oldEnd), () => restore(before)); }
  if(e.target.id==="pinForm"){ e.preventDefault(); const a = $("#pin1").value, b = $("#pin2").value;
    if(a.length < 4){ toast("Use at least 4 characters."); return; } if(a !== b){ toast("The two PINs do not match."); return; }
    D.adminHash = hashPin(a); setAdmin(true); render(); toast("Admin PIN changed. Export the Excel file so other copies use it too."); }
});
document.addEventListener("keydown", e => { if(e.key==="Escape" && $("#layer").innerHTML) closeLayer(); });
