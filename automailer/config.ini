[automailer]
; Full path to the master workbook in your OneDrive folder (OneDrive desktop app keeps it synced).
; Example: C:\Users\you\OneDrive - Company\NPD\NPD_Master_Data.xlsx
workbook = %USERPROFILE%\OneDrive\NPD\NPD_Master_Data.xlsx

; preview = write escalation_preview.html, send nothing
; draft   = save emails in your Outlook Drafts folder for a final check
; send    = send through Outlook desktop
; smtp    = send through Office 365 SMTP (needs smtp_user + NPD_SMTP_PASSWORD env variable)
mode = preview

; Re-send an open escalation at the same level after this many days (a new level always mails at once)
repeat_every_days = 2

; While testing, send every email to this one address instead of the real people. Leave empty to go live.
test_recipient =

; Optional: send from a shared mailbox / second account configured in Outlook
send_from_account =

; Optional: where to keep the send log. Default: NPD_Automailer_Log.csv next to the workbook (in OneDrive)
log_file =

smtp_host = smtp.office365.com
smtp_port = 587
smtp_user =
